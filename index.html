<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f7" />
    <script>
      (() => {
        try {
          const mode = localStorage.getItem('klassen-theme') || 'system'
          const dark = matchMedia('(prefers-color-scheme: dark)').matches
          const resolved = mode === 'system' ? (dark ? 'dark' : 'light') : mode
          document.documentElement.dataset.themeMode = mode
          document.documentElement.dataset.theme = resolved
          document.querySelector('meta[name="theme-color"]').content = resolved === 'dark' ? '#111519' : '#f3f5f7'
        } catch {
          document.documentElement.dataset.themeMode = 'system'
          const resolved = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = resolved
          document.querySelector('meta[name="theme-color"]').content = resolved === 'dark' ? '#111519' : '#f3f5f7'
        }
      })()
    </script>
    <meta name="description" content="KLASSEN — задачи, коммуникации и ответственность команды" />
