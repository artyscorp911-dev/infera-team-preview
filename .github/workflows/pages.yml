name: Deploy and verify GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact public artifact
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
          APP_SHA: 34a6963e8b723799c80e616a7ad7714e153f37b9
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location "${PREVIEW_URL}" --output /tmp/index.html; then break; fi
            sleep 5
          done
          grep -F '<div id="root"></div>' /tmp/index.html
          curl --fail --silent --show-error --location "${PREVIEW_URL}build-meta.json" --output /tmp/build-meta.json
          grep -F "${APP_SHA}" /tmp/build-meta.json
          curl --fail --silent --show-error --location "${PREVIEW_URL}manifest.webmanifest" --output /tmp/manifest.webmanifest
          curl --fail --silent --show-error --location "${PREVIEW_URL}sw.js" --output /tmp/sw.js
      - name: Install public browser smoke dependencies
        run: |
          npm install --no-save @playwright/test@1.54.1
          npx playwright install --with-deps chromium webkit
      - name: Create public browser smoke
        run: |
          mkdir -p public-smoke evidence
          cat > public-smoke/playwright.config.cjs <<'EOF'
          const { defineConfig, devices } = require('@playwright/test')
          module.exports = defineConfig({
            testDir: '.',
            timeout: 90000,
            workers: 1,
            use: { baseURL: process.env.PREVIEW_URL, screenshot: 'only-on-failure', trace: 'retain-on-failure' },
            projects: [
              { name: 'chromium', use: { ...devices['Desktop Chrome'] } },
              { name: 'webkit', use: { ...devices['Desktop Safari'] } },
              { name: 'iphone-webkit', use: { ...devices['iPhone 13'] } },
            ],
          })
          EOF
          cat > public-smoke/public.spec.cjs <<'EOF'
          const { test, expect } = require('@playwright/test')

          async function openDemo(page) {
            const response = await page.goto('./', { waitUntil: 'domcontentloaded' })
            expect(response.status()).toBe(200)
            await page.getByRole('button', { name: 'Открыть демонстрацию' }).click()
            const onboarding = page.getByRole('dialog', { name: 'Что нового в KLASSEN' })
            if (await onboarding.isVisible()) {
              await onboarding.getByRole('radio', { name: /Русский/ }).click()
              await onboarding.getByRole('button', { name: 'Продолжить', exact: true }).click()
            }
          }

          test('exact Phase 2E Preview loads and owner controls work', async ({ page, request }, testInfo) => {
            const failures = []
            const consoleErrors = []
            page.on('response', response => { if (response.status() >= 400) failures.push(`${response.status()} ${response.url()}`) })
            page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()) })
            const meta = await request.get('./build-meta.json')
            expect(meta.status()).toBe(200)
            expect((await meta.json()).source_commit).toBe('34a6963e8b723799c80e616a7ad7714e153f37b9')
            await openDemo(page)
            await expect(page.getByRole('heading', { name: /Карта выполнения/ })).toBeVisible()
            expect(await page.evaluate(() => document.documentElement.scrollWidth)).toBeLessThanOrEqual(await page.evaluate(() => innerWidth))
            await page.getByRole('button', { name: 'Поставить задачу', exact: true }).first().click()
            await expect(page.getByRole('heading', { name: 'Создать поручение' })).toBeVisible()
            await expect(page.getByRole('group', { name: /Кому поручить/ })).toBeVisible()
            await page.screenshot({ path: `evidence/${testInfo.project.name}-recipient-first-screen.png`, fullPage: true })
            expect(failures).toEqual([])
            expect(consoleErrors).toEqual([])
          })

          test('connector catalog is honest and role-isolated', async ({ page }, testInfo) => {
            await openDemo(page)
            const direct = page.getByRole('button', { name: /Центр подключений|Подключения и сервисы/ }).first()
            if (await direct.isVisible()) await direct.click()
            else {
              await page.getByRole('button', { name: 'Ещё', exact: true }).click()
              await page.getByRole('button', { name: /Центр подключений|Подключения и сервисы/ }).click()
            }
            await expect(page.getByRole('heading', { name: 'Подключения и сервисы' })).toBeVisible()
            await expect(page.getByText(/Интерфейс RU\/DE\/EN работает встроенно и бесплатно/).first()).toBeVisible()
            const content = (await page.locator('main').innerText()).toLowerCase()
            for (const forbidden of ['sandbox', 'fixture', 'provider-neutral']) expect(content).not.toContain(forbidden)
            await page.screenshot({ path: `evidence/${testInfo.project.name}-connectors.png`, fullPage: true })
          })
          EOF
      - name: Run public Chromium, WebKit and iPhone smoke
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: npx playwright test --config=public-smoke/playwright.config.cjs
      - name: Upload public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-preview-evidence
          path: |
            evidence
            test-results
          if-no-files-found: warn
          retention-days: 14
