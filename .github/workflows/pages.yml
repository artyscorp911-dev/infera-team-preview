name: Deploy and verify GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public HTTPS resources
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location "${PREVIEW_URL}" --output /tmp/index.html; then break; fi
            sleep 5
          done
          grep -F '<div id="root"></div>' /tmp/index.html
          curl --fail --silent --show-error --location "${PREVIEW_URL}build-meta.json" | tee /tmp/build-meta.json
          grep -F '26517d681bed2a3b1fad9863950a09adbb4929c9' /tmp/build-meta.json
          curl --fail --silent --show-error --location "${PREVIEW_URL}manifest.webmanifest" --output /tmp/manifest.webmanifest
          curl --fail --silent --show-error --location "${PREVIEW_URL}sw.js" --output /tmp/sw.js
          curl --fail --silent --show-error --location "${PREVIEW_URL}assets/index-DiyNR5be.js" --output /tmp/app.js
          curl --fail --silent --show-error --location "${PREVIEW_URL}assets/index-5a4y6KyG.css" --output /tmp/app.css
      - name: Install public browser smoke dependencies
        run: |
          npm install --no-save @playwright/test@1.54.1
          npx playwright install --with-deps chromium webkit
      - name: Create public browser smoke
        run: |
          mkdir -p public-smoke
          cat > public-smoke/playwright.config.cjs <<'EOF'
          const { defineConfig, devices } = require('@playwright/test')
          module.exports = defineConfig({
            testDir: '.',
            timeout: 60000,
            use: { baseURL: process.env.PREVIEW_URL, screenshot: 'on' },
            projects: [
              { name: 'chromium', use: { ...devices['Desktop Chrome'] } },
              { name: 'webkit', use: { ...devices['Desktop Safari'] } },
              { name: 'iphone', use: { ...devices['iPhone 13'] } },
            ],
          })
          EOF
          cat > public-smoke/public.spec.cjs <<'EOF'
          const { test, expect } = require('@playwright/test')
          test('public Preview loads, enters demo and registers PWA', async ({ page }) => {
            const failures = []
            const consoleErrors = []
            page.on('response', response => {
              if (response.status() >= 400) failures.push(response.status() + ' ' + response.url())
            })
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text())
            })
            const response = await page.goto('./', { waitUntil: 'domcontentloaded' })
            expect(response.status()).toBe(200)
            await expect(page.getByRole('button', { name: 'Открыть демонстрацию' })).toBeVisible()
            await page.getByRole('button', { name: 'Открыть демонстрацию' }).click()
            await expect(page.locator('.app-shell')).toBeVisible()
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth)
            expect(overflow).toBeLessThanOrEqual(1)
            const manifest = await page.request.get('./manifest.webmanifest')
            expect(manifest.status()).toBe(200)
            await page.evaluate(async () => { await navigator.serviceWorker.ready })
            expect(failures).toEqual([])
            expect(consoleErrors).toEqual([])
          })
          EOF
      - name: Run public Chromium, WebKit and iPhone smoke
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: npx playwright test --config=public-smoke/playwright.config.cjs
      - name: Upload public browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-smoke
          path: test-results
          if-no-files-found: warn
      - name: Lighthouse public Preview
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: npx --yes lighthouse@12.8.2 "${PREVIEW_URL}" --output=json --output-path=lighthouse-report.json --chrome-flags="--headless --no-sandbox"
      - name: Publish verified status
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=pages-public-verify \
            -f description="HTTPS, source SHA, assets and Lighthouse verified" \
            -f target_url="${PREVIEW_URL}"
      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-public-preview
          path: lighthouse-report.json
          if-no-files-found: warn
