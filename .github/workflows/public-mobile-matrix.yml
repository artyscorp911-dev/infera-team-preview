name: Verify public mobile task filters

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-mobile-matrix
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_URL: https://artyscorp911-dev.github.io/infera-team-preview/
      APP_SHA: 9572da54ba06a3c14a801cc580ab8987c9572c3f
    steps:
      - name: Wait for exact Preview
        run: |
          for attempt in {1..24}; do
            if curl --fail --silent --show-error --location "${PREVIEW_URL}build-meta.json" --output /tmp/build-meta.json && grep -F "${APP_SHA}" /tmp/build-meta.json; then
              exit 0
            fi
            sleep 5
          done
          echo "Exact Preview did not become ready" >&2
          exit 1
      - name: Verify public PWA resources
        run: |
          curl --fail --silent --show-error --location "${PREVIEW_URL}" --output /tmp/index.html
          grep -F '<div id="root"></div>' /tmp/index.html
          curl --fail --silent --show-error --location "${PREVIEW_URL}manifest.webmanifest" --output /tmp/manifest.webmanifest
          curl --fail --silent --show-error --location "${PREVIEW_URL}sw.js" --output /tmp/sw.js
          curl --fail --silent --show-error --location "${PREVIEW_URL}assets/index-C3OW_yRD.js" --output /tmp/app.js
          curl --fail --silent --show-error --location "${PREVIEW_URL}assets/index-CC-IhHsc.css" --output /tmp/app.css
      - name: Install browser test dependencies
        run: |
          npm install --no-save @playwright/test@1.54.1
          npx playwright install --with-deps chromium webkit
      - name: Create exact public matrix
        run: |
          mkdir -p public-matrix evidence
          cat > public-matrix/playwright.config.cjs <<'EOF'
          const { defineConfig, devices } = require('@playwright/test')
          module.exports = defineConfig({
            testDir: '.',
            timeout: 120000,
            workers: 2,
            use: { baseURL: process.env.PREVIEW_URL, trace: 'retain-on-failure' },
            projects: [
              { name: 'chromium', use: { ...devices['Desktop Chrome'] } },
              { name: 'webkit', use: { ...devices['Desktop Safari'] } },
            ],
          })
          EOF
          cat > public-matrix/mobile-filters.spec.cjs <<'EOF'
          const { test, expect } = require('@playwright/test')
          const fs = require('fs')
          const path = require('path')
          const widths = [[320,568],[360,800],[375,667],[390,844],[393,852],[430,932]]
          const filters = [['Все',5],['Активные',5],['Мои',0],['Доступные',0],['Без исполнителя',1],['Просроченные',1],['На проверке',0]]
          fs.mkdirSync(path.resolve('evidence'), { recursive: true })

          for (const [width, height] of widths) {
            test(`public task filters ${width}x${height}`, async ({ page }, testInfo) => {
              const failedResponses = []
              const consoleErrors = []
              page.on('response', response => {
                if (response.status() >= 400) failedResponses.push(response.status() + ' ' + response.url())
              })
              page.on('console', message => {
                if (message.type() === 'error') consoleErrors.push(message.text())
              })

              await page.setViewportSize({ width, height })
              const response = await page.goto('./', { waitUntil: 'domcontentloaded' })
              expect(response.status()).toBe(200)
              await page.getByRole('button', { name: 'Открыть демонстрацию' }).click()
              const onboarding = page.getByRole('dialog', { name: 'Что нового в KLASSEN' })
              if (await onboarding.isVisible()) await onboarding.getByRole('button', { name: 'Продолжить', exact: true }).click()
              await page.getByRole('button', { name: 'Вид', exact: true }).click()
              await page.locator('.scale-options button').filter({ hasText: 'Очень крупный' }).click()
              await page.getByRole('button', { name: 'Закрыть настройки' }).click()
              await page.locator('button:visible').filter({ hasText: /^Задачи$/ }).first().click()

              const browser = testInfo.project.name
              await page.screenshot({ path: `evidence/${browser}-${width}x${height}-cards.png`, fullPage: true })
              const tabs = page.getByLabel('Фильтры задач')
              const layout = await tabs.evaluate(element => {
                const boxes = [...element.querySelectorAll('button')].map(button => {
                  const rect = button.getBoundingClientRect()
                  return {
                    label: button.textContent.trim(),
                    left: rect.left,
                    right: rect.right,
                    width: rect.width,
                    height: rect.height,
                    clientWidth: button.clientWidth,
                    scrollWidth: button.scrollWidth,
                  }
                })
                return {
                  boxes,
                  pageWidth: document.documentElement.scrollWidth,
                  viewportWidth: window.innerWidth,
                  pageLeft: document.documentElement.scrollLeft,
                  clientWidth: element.clientWidth,
                  scrollWidth: element.scrollWidth,
                }
              })
              expect(layout.pageWidth).toBeLessThanOrEqual(layout.viewportWidth)
              expect(layout.scrollWidth).toBeGreaterThan(layout.clientWidth)
              for (const box of layout.boxes) {
                expect(box.scrollWidth, `${box.label} clipped`).toBeLessThanOrEqual(box.clientWidth + 1)
                expect(box.width, `${box.label} width`).toBeGreaterThanOrEqual(44)
                expect(box.height, `${box.label} height`).toBeGreaterThanOrEqual(44)
              }
              for (let index = 0; index < layout.boxes.length - 1; index += 1) {
                expect(layout.boxes[index].right, `${layout.boxes[index].label} overlaps ${layout.boxes[index + 1].label}`).toBeLessThanOrEqual(layout.boxes[index + 1].left)
              }
              await tabs.evaluate(element => { element.scrollLeft = element.scrollWidth })
              expect(await page.evaluate(() => document.documentElement.scrollLeft)).toBe(layout.pageLeft)

              for (const [label, count] of filters) {
                const button = page.getByRole('button', { name: label, exact: true })
                await button.scrollIntoViewIfNeeded()
                await button.click()
                await expect(button).toHaveAttribute('aria-pressed', 'true')
                await expect(button).toHaveClass(/active/)
                await expect(page.locator('.task-list .task-row')).toHaveCount(count)
                const safeLabel = label.toLowerCase().replace(/\\s+/g, '-')
                await page.screenshot({ path: `evidence/${browser}-${width}x${height}-filter-${safeLabel}.png`, fullPage: true })
              }
              await page.screenshot({ path: `evidence/${browser}-${width}x${height}-empty.png`, fullPage: true })
              expect(await page.evaluate(() => document.documentElement.scrollWidth)).toBeLessThanOrEqual(width)
              expect(failedResponses).toEqual([])
              expect(consoleErrors).toEqual([])
            })
          }
          EOF
      - name: Run Chromium and WebKit six-width matrix
        run: npx playwright test --config=public-matrix/playwright.config.cjs
      - name: Upload public matrix screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-mobile-filter-matrix
          path: |
            evidence
            test-results
          if-no-files-found: error
